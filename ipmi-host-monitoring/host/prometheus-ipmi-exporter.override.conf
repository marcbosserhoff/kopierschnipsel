# Drop-in for the Debian package's prometheus-ipmi-exporter.service.
[Unit]
ConditionPathExists=/dev/ipmi0

[Service]
# FreeIPMI checks UID 0 for local operation. Root is confined by the settings
# below; the device still permits management commands, not just sensor reads.
User=root
Group=root
SupplementaryGroups=
DynamicUser=false
PrivateUsers=false
PrivateDevices=false

# Ignore the package's /etc/default/prometheus-ipmi-exporter and its remote
# example config. This environment file contains only the listener address.
EnvironmentFile=
EnvironmentFile=/etc/default/ipmi-host-exporter
ExecStart=
ExecStart=/usr/bin/prometheus-ipmi-exporter --config.file=/etc/prometheus/ipmi_host.yml --freeipmi.path=/usr/sbin --web.listen-address=${IPMI_LISTEN_ADDRESS}

Restart=on-failure
RestartSec=5s
UMask=0077
CacheDirectory=ipmi-exporter
CacheDirectoryMode=0700
NoNewPrivileges=true
CapabilityBoundingSet=
AmbientCapabilities=
DeviceAllow=
DevicePolicy=closed
DeviceAllow=/dev/ipmi0 rw
ProtectSystem=strict
ProtectHome=true
InaccessiblePaths=-/etc/kubernetes -/var/lib/kubelet -/var/lib/etcd
InaccessiblePaths=-/run/containerd -/run/crio -/run/docker.sock
PrivateTmp=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectControlGroups=true
RestrictNamespaces=true
RestrictRealtime=true
RestrictSUIDSGID=true
LockPersonality=true
SystemCallArchitectures=native
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
