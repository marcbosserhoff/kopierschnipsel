# OPTIONAL additive RBAC: apply ONLY if the Prometheus service account is missing
# Node discovery permissions. EDIT both subject placeholders first.
# This file is deliberately absent from the default kustomization.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ipmi-host-node-discovery
rules:
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ipmi-host-node-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ipmi-host-node-discovery
subjects:
  - kind: ServiceAccount
    name: CHANGEME_PROMETHEUS_SERVICE_ACCOUNT
    namespace: CHANGEME_PROMETHEUS_NAMESPACE
