# Docker/Kubernetes GitLab Runner; CI validates files and does not deploy.
image: debian:trixie-slim

stages:
  - validate

validate:
  stage: validate
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends bash python3 python3-yaml shellcheck systemd
  script:
    - bash scripts/validate-repository.sh
